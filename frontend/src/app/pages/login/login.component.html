<div class="min-h-screen flex items-center justify-center bg-pia-dark px-4">
  <div class="bg-pia-card border border-pia-green/30 rounded-2xl p-8 w-full max-w-md shadow-2xl">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-pia-cream mb-2 tracking-tight">
        pia<span class="text-pia-green-light">quadra</span>
      </h1>
      <p class="text-gray-400">{{ isLoginMode ? 'Faça login para reservar' : 'Crie sua conta' }}</p>
    </div>

    @if (errorMessage) {
      <div class="bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-xl mb-4 text-sm text-center">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      
      @if (!isLoginMode) {
        <div>
          <label class="block text-sm font-semibold text-pia-cream mb-1">Nome Completo</label>
          <input type="text" [(ngModel)]="name" name="name" required class="w-full bg-pia-dark border border-pia-green/30 rounded-xl p-3 text-pia-cream outline-none focus:border-pia-green-light">
        </div>
        <div>
          <label class="block text-sm font-semibold text-pia-cream mb-1">Telefone</label>
          <input type="text" [(ngModel)]="phone" name="phone" class="w-full bg-pia-dark border border-pia-green/30 rounded-xl p-3 text-pia-cream outline-none focus:border-pia-green-light">
        </div>
      }

      <div>
        <label class="block text-sm font-semibold text-pia-cream mb-1">Email</label>
        <input type="email" [(ngModel)]="email" name="email" required class="w-full bg-pia-dark border border-pia-green/30 rounded-xl p-3 text-pia-cream outline-none focus:border-pia-green-light">
      </div>

      <div>
        <label class="block text-sm font-semibold text-pia-cream mb-1">Senha</label>
        <input type="password" [(ngModel)]="password" name="password" required class="w-full bg-pia-dark border border-pia-green/30 rounded-xl p-3 text-pia-cream outline-none focus:border-pia-green-light">
      </div>

      <button type="submit" class="w-full bg-pia-green hover:bg-pia-green-light text-pia-cream font-extrabold py-3 rounded-xl transition-colors mt-2">
        {{ isLoginMode ? 'Entrar' : 'Criar Conta' }}
      </button>
    </form>

    <div class="text-center mt-6">
      <button (click)="toggleMode()" class="text-sm text-gray-400 hover:text-pia-cream transition-colors">
        {{ isLoginMode ? 'Não tem conta? Cadastre-se' : 'Já tem conta? Faça login' }}
      </button>
    </div>
    
    <div class="text-center mt-4">
      <a routerLink="/" class="text-sm text-pia-green-light hover:underline">Voltar para a Home</a>
    </div>
  </div>
</div>
