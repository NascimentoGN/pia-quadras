<div class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
  <div class="bg-[#151A23] border border-gray-800 rounded-xl p-6 w-full max-w-md shadow-2xl relative">
    
    <button (click)="fechar()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>

    <h2 class="text-2xl font-bold text-white mb-2">{{ court?.name }}</h2>
    <p class="text-gray-400 mb-6">Escolha a data e horário</p>

    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-sm text-gray-400 mb-1">Data</label>
        <input type="date" [(ngModel)]="bookingDate" class="w-full bg-[#0B0E14] border border-gray-700 rounded-lg p-3 text-white outline-none focus:border-[#00E676]">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Horário</label>
        <select [(ngModel)]="startTime" class="w-full bg-[#0B0E14] border border-gray-700 rounded-lg p-3 text-white outline-none focus:border-[#00E676]">
          <option value="08:00">08:00</option>
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="19:00">19:00</option>
        </select>
      </div>
    </div>

    <button (click)="confirmarReserva()" class="w-full bg-[#00E676] hover:bg-[#00C853] text-black font-bold py-3 rounded-lg transition-colors">
      Confirmar Reserva
    </button>
  </div>
</div>
